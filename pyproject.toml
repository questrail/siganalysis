# pyproject.toml

[project]
name = "siganalysis"
version = "0.8.0"
description = "Perform signal analysis"
readme = "README.md"
authors = [
  { name = "Matthew Rankin", email = "369937+matthewrankin@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2.0", "scipy>=1.14.1"]
classifiers = [
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'License :: OSI Approved :: MIT License',
  'Development Status :: 4 - Beta',
  'Operating System :: OS Independent',
  'Intended Audience :: Developers',
  'Topic :: Software Development :: Libraries :: Python Modules',
]

[project.optional-dependencies]
# matplotlib is needed only to plot, so it is not pulled in by default.
plotting = ["matplotlib>=3.10.0"]

[project.urls]
Homepage = "https://github.com/questrail/siganalysis"
Issues = "https://github.com/questrail/siganalysis/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Collect the tests, and the examples in the docstrings so that an example
# that stops working is a failing test rather than a surprise for a reader.
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.ty.environment]
# The project uses a src layout, so first-party modules live under src/.
root = ["./src"]

[tool.ty.src]
include = ["src"]

[dependency-groups]
dev = [
    # The tests cover the plotting, so the extra is needed here.
    "matplotlib>=3.10.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
