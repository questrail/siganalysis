# pyproject.toml

[project]
name = "siganalysis"
version = "0.8.0"
description = "Perform signal analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Matthew Rankin", email = "369937+matthewrankin@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2.0", "scipy>=1.14.1"]
classifiers = [
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Development Status :: 4 - Beta',
  'Operating System :: OS Independent',
  'Intended Audience :: Developers',
  'Topic :: Software Development :: Libraries :: Python Modules',
]

[project.optional-dependencies]
# matplotlib is needed only to plot, so it is not pulled in by default.
plotting = ["matplotlib>=3.10.0"]

[project.urls]
Homepage = "https://github.com/questrail/siganalysis"
Issues = "https://github.com/questrail/siganalysis/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siganalysis"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Select rules explicitly rather than relying on ruff's defaults, so that the
# rule set is a deliberate choice. The ruff version itself is pinned by uv.lock.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "EXE", # flake8-executable
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# A test asserts against the value it expects, which is the literal PLR2004
# objects to. Naming each one would put a constant between the assertion and
# what it claims. The rule still applies under src/, where the handful of
# deliberate cases carry a noqa apiece.
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
# Collect the tests, and the examples in the docstrings so that an example
# that stops working is a failing test rather than a surprise for a reader.
testpaths = ["tests", "src"]
addopts = ["--strict-markers", "--strict-config", "--doctest-modules"]

[tool.coverage.run]
source = ["siganalysis"]
branch = true
# Coveralls maps the report onto the repository, and absolute paths from a
# runner's checkout directory are not something it can map.
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
# A floor rather than a target: set at what the suite covers today, so that
# uncovered code has to arrive with either a test or a deliberate edit to this
# line. The gap is in plotting.py, which is the part hardest to assert on.
fail_under = 95

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]

[dependency-groups]
dev = [
    # The tests cover the plotting, so the extra is needed here.
    "matplotlib>=3.10.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    # pyright cannot see the window functions in scipy.signal.windows without
    # these; scipy ships no usable stubs of its own.
    "scipy-stubs>=1.18.1.0",
    "zizmor>=1.30.0",
]
